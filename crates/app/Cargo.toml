[package]
name = "dalan-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "dalan-doctor"

[[bin]]
name = "dalan-doctor"
path = "src/bin/doctor.rs"

[[bin]]
name = "dalan"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:gpui"]
runtime-shaders = ["desktop", "gpui/runtime_shaders"]

[dependencies]
dalan-core.workspace = true
dalan-drivers.workspace = true
dalan-acp.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, optional = true }

[lints]
workspace = true
