[package]
name = "dalan-drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dalan-core.workspace = true
mysql_async = { version = "=0.37.1", default-features = false, features = ["default-rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "process", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
url = "2"
percent-encoding = "2"
sqlparser = { version = "=0.62.0", features = ["visitor"] }
native-tls = "0.2"
tokio-native-tls = "0.3"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
